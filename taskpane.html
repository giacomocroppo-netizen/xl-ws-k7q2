<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snipper</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=3" />
</head>
<body>
  <input id="import" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple hidden />
  <input id="importdir" type="file" webkitdirectory hidden />
  <div id="dropover" class="dropover" hidden><div>📥 Rilascia qui documenti (PDF, PNG, JPG) o cartelle</div></div>

  <div class="tabs">
    <button id="tab-snip" class="tab active">✂️ Spunta</button>
    <button id="tab-org" class="tab">📁 Organizza</button>
  </div>

  <div id="ocrbanner" class="banner" hidden>
    <div id="ocrtext"></div>
    <div class="bbtns">
      <button id="ocrrun" class="btn primary">Esegui OCR</button>
      <button id="ocrlater" class="btn">Più tardi</button>
    </div>
  </div>

  <!-- ===== SCHERMATA SPUNTA ===== -->
  <section id="view-snip">
    <div class="bar">
      <select id="docselect" title="Documento aperto"></select>
      <label class="btn primary" for="import" title="Aggiungi documenti (puoi anche trascinarli nel pannello)">➕ Importa</label>
    </div>

    <div class="bar">
      <input id="q" type="search" placeholder="🔍 Cerca una parola in tutti i documenti…" />
      <button id="qgo">Cerca</button>
    </div>
    <div id="results" class="panel" hidden>
      <div class="row"><strong id="resultstitle">Risultati</strong><button id="resultsclose" title="Chiudi">✕</button></div>
      <ul id="resultslist"></ul>
    </div>

    <div class="bar">
      <div class="seg">
        <button id="mode-snip" class="active" title="Seleziona un'area: il valore va nella cella attiva">SNIP</button>
        <button id="mode-sum" title="Seleziona più numeri: scrive la somma come formula">SUM SNIP</button>
      </div>
      <button id="prev" title="Pagina precedente">◀</button>
      <span id="pageinfo">–</span>
      <button id="next" title="Pagina successiva">▶</button>
      <button id="zoomout" title="Riduci">−</button>
      <button id="zoomin" title="Ingrandisci">+</button>
      <button id="findsnip" title="Mostra nel documento lo snip della cella selezionata">🎯 Vai allo snip</button>
    </div>

    <div class="bar small">
      <label>Numeri:
        <select id="numfmt">
          <option value="it">Italiano (1.234,56)</option>
          <option value="en">Inglese (1,234.56)</option>
        </select>
      </label>
      <label><input type="checkbox" id="movedown" /> vai alla cella sotto</label>
      <label><input type="checkbox" id="asnumber" checked /> converti in numero</label>
      <label title="Quando clicchi una cella con uno snip, apre il pannello e lo mostra"><input type="checkbox" id="autoopen" checked /> apri lo snip cliccando la cella</label>
    </div>

    <div class="bar small">
      <label>OCR:
        <select id="ocrscope">
          <option value="current">pagina corrente</option>
          <option value="missing">pagine senza testo</option>
          <option value="all">tutto il documento</option>
        </select>
      </label>
      <button id="ocrgo" title="Legge il testo delle pagine con l'OCR (anche per ricerca e snip)">🔎 Avvia OCR</button>
      <span id="ocrinfo" class="muted"></span>
    </div>

    <div id="sumpanel" class="panel" hidden>
      <div class="row"><strong>SUM SNIP</strong> <span id="sumtotal" class="total">Totale: 0</span></div>
      <ul id="sumlist"></ul>
      <div class="row">
        <button id="sumwrite" class="btn primary">Scrivi somma in cella</button>
        <button id="sumclear" class="btn">Svuota</button>
      </div>
    </div>

    <div id="viewer">
      <div id="stage" style="display:none">
        <canvas id="canvas"></canvas>
        <div id="overlay"></div>
      </div>
      <div id="empty" class="empty">
        <div class="bigdrop">📥<br>Trascina qui un documento (o una cartella)<br><span class="muted">oppure premi «➕ Importa»</span></div>
      </div>
    </div>
  </section>

  <!-- ===== SCHERMATA ORGANIZZA ===== -->
  <section id="view-org" hidden>
    <div class="bar">
      <input id="docfilter" type="search" placeholder="Filtra per nome documento…" />
    </div>
    <div class="bar small">
      <span>Importa in: <strong id="target">📂 cartella principale</strong></span>
    </div>
    <div id="selbar" class="bar small selbar" hidden>
      <span id="selcount"></span>
      <select id="selmove" title="Sposta i documenti selezionati"></select>
      <button id="selmovego">Sposta</button>
      <button id="seldelete" class="danger">🗑 Elimina</button>
      <button id="selclear">Deseleziona</button>
    </div>
    <div id="orgsummary" class="muted pad"></div>
    <div id="tree"></div>
    <div id="dropzone" class="dropzone">
      <div>📥 Trascina qui i documenti o le cartelle</div>
      <div class="dzbtns">
        <label class="btn primary" for="import">Importa documenti</label>
        <label class="btn" for="importdir">Importa cartella</label>
      </div>
    </div>
  </section>

  <div id="status" class="status">Pronto.</div>

  <script src="snip-lib.js?v=3"></script>
  <script src="folder-lib.js?v=3"></script>
  <script src="text-lib.js?v=3"></script>
  <script src="export-lib.js?v=3"></script>
  <script src="taskpane.js?v=3"></script>
</body>
</html>
